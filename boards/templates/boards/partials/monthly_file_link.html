{% load tag_helpers %}{% with meta=att.file|file_meta %}{% if meta.kind == 'sheet' %}<a href="{{ att.file.url }}" data-sheet-src="{% url 'boards:attachment_sheet_preview' card.id att.id %}" data-sheet-name="{{ meta.name }}" data-sheet-download="{{ att.file.url }}" title="Ver {{ meta.name }} sem baixar">📊 {{ meta.name|default:att.file.name }}</a>{% elif meta.kind == 'image' %}<a href="{{ att.file.url }}" target="_blank" rel="noopener" data-zoom-src="{{ att.file.url }}" data-zoom-name="{{ meta.name }}">🔍 {{ meta.name|default:att.file.name }}</a>{% else %}<a href="{{ att.file.url }}" target="_blank" rel="noopener">{{ meta.name|default:att.file.name }}</a>{% endif %}{% endwith %}
