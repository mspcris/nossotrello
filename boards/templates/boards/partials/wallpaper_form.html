<div id="modal-bg" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">

    <div class="bg-white rounded-xl p-6 shadow-xl w-96 relative">

        <h2 class="text-xl font-semibold mb-4">Plano de Fundo do Quadro</h2>

        <div id="image-error" class="text-red-600 text-sm font-semibold mb-3" style="display:none;"></div>

        <form method="POST" enctype="multipart/form-data" hx-post="{% url 'boards:update_board_wallpaper' board.id %}"
            hx-target="#modal-bg" hx-swap="outerHTML">

            {% csrf_token %}

            <label class="font-medium text-sm">Enviar arquivo:</label>
            <input type="file" name="image" class="w-full border rounded px-3 py-2 mb-4">

            <label class="font-medium text-sm">Ou usar URL:</label>
            <input type="text" name="image_url" placeholder="https://..." class="w-full border rounded px-3 py-2 mb-4">

            <label class="font-medium text-sm">Ou cor estática:</label>
            <input type="hidden" name="bg_color" id="wp-bg-color" value="">
            <div class="flex flex-wrap items-center gap-2 mt-2 mb-4">
              <button type="button" onclick="window.__wpColor('#0f172a')" title="#0f172a" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#0f172a;cursor:pointer;"></button>
              <button type="button" onclick="window.__wpColor('#334155')" title="#334155" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#334155;cursor:pointer;"></button>
              <button type="button" onclick="window.__wpColor('#7f1d1d')" title="#7f1d1d" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#7f1d1d;cursor:pointer;"></button>
              <button type="button" onclick="window.__wpColor('#14532d')" title="#14532d" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#14532d;cursor:pointer;"></button>
              <button type="button" onclick="window.__wpColor('#1e3a8a')" title="#1e3a8a" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#1e3a8a;cursor:pointer;"></button>
              <button type="button" onclick="window.__wpColor('#581c87')" title="#581c87" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#581c87;cursor:pointer;"></button>
              <button type="button" onclick="window.__wpColor('#9d174d')" title="#9d174d" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#9d174d;cursor:pointer;"></button>
              <button type="button" onclick="window.__wpColor('#92400e')" title="#92400e" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#92400e;cursor:pointer;"></button>
              <button type="button" onclick="window.__wpColor('#3f3f46')" title="#3f3f46" style="height:30px;width:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#3f3f46;cursor:pointer;"></button>
              <input type="color" id="wp-color-free" value="{{ board.background_color|default:'#0f172a' }}"
                     onchange="window.__wpColor(this.value)" title="Cor personalizada"
                     style="height:32px;width:40px;padding:0;border:none;cursor:pointer;">
            </div>

            <div class="flex gap-3 justify-end">
                <button type="submit" class="bg-blue-600 text-white rounded px-4 py-2">
                    Salvar
                </button>
                <button type="button" class="bg-gray-300 rounded px-4 py-2"
                    onclick="document.getElementById('modal-bg').remove();">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    window.__wpColor = function (c) {
        var h = document.getElementById("wp-bg-color");
        if (h) h.value = c;
        var form = document.querySelector("#modal-bg form");
        if (form) { form.requestSubmit ? form.requestSubmit() : form.submit(); }
    };
    document.body.addEventListener("htmx:responseError", function () {
        const target = document.querySelector("#image-error");
        if (target) {
            target.style.display = "block";
            target.innerText = "Erro ao importar. Verifique o arquivo ou URL.";
        }
    });
</script>
