{# templates/boards/partials/card_secret_reveal.html #}
{# Conteúdo revelado de um CardSecret. {{ plaintext }} é auto-escapado pelo #}
{# Django (seguro contra XSS); innerText devolve o texto original pra cópia. #}
<div class="cm-secret-revealed">
  <pre id="cm-secret-pre-{{ secret.id }}" class="cm-secret-pre">{{ plaintext }}</pre>

  <div class="cm-secret-revealed-actions">
    <button type="button" class="cm-btn primary"
            onclick="(function(b){
              var pre=document.getElementById('cm-secret-pre-{{ secret.id }}');
              var t=pre?pre.innerText:'';
              if(navigator.clipboard&&navigator.clipboard.writeText){
                navigator.clipboard.writeText(t).then(function(){
                  var o=b.innerText; b.innerText='✅ Copiado';
                  setTimeout(function(){b.innerText=o;},1500);
                });
              }
            })(this)">📋 Copiar</button>

    <button type="button" class="cm-btn"
            onclick="var box=document.getElementById('cm-secret-revealed-{{ secret.id }}');
                     var btn=document.getElementById('cm-reveal-btn-{{ secret.id }}');
                     if(box){box.innerHTML='';}
                     if(btn){btn.style.display='';}">
      🙈 Ocultar
    </button>
  </div>
</div>
