<div
  class="column-item aggregator-column w-64 shrink-0 flex flex-col"
  data-aggregator="1"
  aria-disabled="true"
>
  <!-- HEADER -->
  <div class="column-header px-3 py-2">
    <h3 class="font-semibold text-sm">Controle de Colunas</h3>
    <button type="button" class="agg-menu-btn" aria-label="Opções da coluna" title="Cores da coluna">⋮</button>
    <div class="agg-menu" hidden>
      <label class="agg-menu-row">🎨 Cor da coluna<input type="color" id="agg-color-bg"></label>
      <label class="agg-menu-row">🔤 Cor da fonte<input type="color" id="agg-color-fg"></label>
      <label class="agg-menu-row">📌 Travar coluna<input type="checkbox" id="agg-pin-lock" checked></label>
      <button type="button" class="agg-menu-reset" id="agg-color-reset">Restaurar padrão</button>
    </div>
  </div>

  <!-- BODY (scroll aqui, compatível com o CSS mobile .aggregator-body) -->
  <div class="aggregator-body flex-1 min-h-0 overflow-y-auto px-3 pb-3">
    <ul class="space-y-2">
      {% for col in columns %}
        <li
          class="aggregator-card select-none"
          data-column-id="{{ col.id }}"
          style="pointer-events:auto; cursor:pointer;"
          onclick="if(window.__aggNavGo) window.__aggNavGo(this)"
        >
          <span class="aggregator-count">
            {{ col.visible_cards_count|stringformat:"02d" }}
          </span>
          <span class="aggregator-name">
            {{ col.name }}
          </span>
        </li>
      {% endfor %}
    </ul>
  </div>
</div>


<script>
  // ============================================================
  // Aggregator Column — runtime update
  // ============================================================
  window.updateAggregatorCounts = function () {
    const agg = document.querySelector(".aggregator-column");
    if (!agg) return;

    agg.querySelectorAll(".aggregator-card").forEach(card => {
      const colId = card.dataset.columnId;
      const list = document.getElementById("cards-col-" + colId);
      if (!list) return;

      const count = list.querySelectorAll('li[data-card-id]:not([data-counter="1"])').length;
      const label = String(count).padStart(2, "0");

      const countEl = card.querySelector(".aggregator-count");
      if (countEl) countEl.textContent = label;
    });
  };

  document.addEventListener("DOMContentLoaded", updateAggregatorCounts);
  document.body.addEventListener("htmx:afterSwap", updateAggregatorCounts);
</script>


<script>
  // ============================================================
  // Aggregator Column — runtime update (espelha o header da coluna)
  // ============================================================
  window.updateAggregatorCounts = function () {
    const agg = document.querySelector(".aggregator-column");
    if (!agg) return;

    agg.querySelectorAll(".aggregator-card").forEach(card => {
      const colId = card.dataset.columnId;
      if (!colId) return;

      // acha a coluna real
      const colEl = document.querySelector(`.column-item[data-column-id="${colId}"]`);
      if (!colEl) return;

      // pega o texto que já está correto no header (ex: "4 cards")
      const counterEl = colEl.querySelector("[data-column-counter]");
      if (!counterEl) return;

      const txt = (counterEl.textContent || "").trim(); // "4 cards"
      const n = parseInt(txt, 10);
      const label = String(Number.isFinite(n) ? n : 0).padStart(2, "0");

      const countEl = card.querySelector(".aggregator-count");
      if (countEl) countEl.textContent = label;
    });
  };

  document.addEventListener("DOMContentLoaded", window.updateAggregatorCounts);
  document.body.addEventListener("htmx:afterSwap", window.updateAggregatorCounts);
  document.body.addEventListener("htmx:afterSettle", window.updateAggregatorCounts);
</script>


<script>
  // ============================================================
  // Coluna de Totais — menu próprio: cor da coluna + cor da fonte
  // (persistido em localStorage, aplicado via CSS vars --agg-bg/--agg-fg)
  // ============================================================
  (function () {
    var KEY = "cm_agg_skin";
    function load() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
    function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
    function apply(s) {
      var col = document.querySelector(".aggregator-column");
      if (!col) return;
      if (s.bg) col.style.setProperty("--agg-bg", s.bg); else col.style.removeProperty("--agg-bg");
      if (s.fg) col.style.setProperty("--agg-fg", s.fg); else col.style.removeProperty("--agg-fg");
      // travada (default) = sticky à esquerda; solta = rola junto com as demais
      col.classList.toggle("agg-unlocked", s.pin === "off");
    }
    function init() {
      var col = document.querySelector(".aggregator-column");
      if (!col) return;
      var s = load();
      apply(s);
      var btn = col.querySelector(".agg-menu-btn");
      var menu = col.querySelector(".agg-menu");
      if (!btn || !menu || btn.dataset.aggBound) return;
      btn.dataset.aggBound = "1";

      // impedir que o sortable da coluna inicie o arraste ao tocar no menu
      btn.draggable = false;
      ["pointerdown", "mousedown", "touchstart", "dragstart"].forEach(function (evt) {
        btn.addEventListener(evt, function (e) { e.stopPropagation(); });
        menu.addEventListener(evt, function (e) { e.stopPropagation(); });
      });

      var bg = col.querySelector("#agg-color-bg");
      var fg = col.querySelector("#agg-color-fg");
      var pin = col.querySelector("#agg-pin-lock");
      var reset = col.querySelector("#agg-color-reset");
      if (bg && s.bg) bg.value = s.bg;
      if (fg && s.fg) fg.value = s.fg;
      if (pin) pin.checked = (s.pin !== "off");

      btn.addEventListener("click", function (ev) { ev.stopPropagation(); menu.hidden = !menu.hidden; });
      if (bg) bg.addEventListener("input", function () {
        s.bg = bg.value;
        // auto-contraste: a fonte acompanha a cor escolhida (override manual no fg abaixo)
        if (window.cmTextColorFor) { s.fg = window.cmTextColorFor(bg.value); if (fg) fg.value = s.fg; }
        apply(s); save(s);
      });
      if (fg) fg.addEventListener("input", function () { s.fg = fg.value; apply(s); save(s); });
      if (pin) pin.addEventListener("change", function () { s.pin = pin.checked ? "on" : "off"; apply(s); save(s); });
      if (reset) reset.addEventListener("click", function () { s = {}; apply(s); save(s); if (pin) pin.checked = true; menu.hidden = true; });

      if (!window.__aggMenuDocClick) {
        window.__aggMenuDocClick = true;
        document.addEventListener("click", function (ev) {
          var m = document.querySelector(".aggregator-column .agg-menu");
          var b = document.querySelector(".aggregator-column .agg-menu-btn");
          if (m && !m.hidden && !m.contains(ev.target) && ev.target !== b) m.hidden = true;
        });
      }
    }
    document.addEventListener("DOMContentLoaded", init);
    document.body.addEventListener("htmx:afterSwap", init);
    if (document.readyState !== "loading") init();
  })();
</script>
