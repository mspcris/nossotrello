{# Template HTML das notificações da rede social.                              #}
{# CSS inline (clientes de email ignoram <style>). Imagem inline via cid.       #}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4faf6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
  <!-- Preheader (preview no inbox, escondido no corpo) -->
  <div style="display:none;font-size:1px;color:#f4faf6;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    {{ subject }}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4faf6;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:540px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(34,197,94,0.10);">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding:32px 28px 14px;">
              <img src="cid:camim-social"
                   alt="NossoTrello Social"
                   width="160" height="160"
                   style="display:block;width:160px;height:160px;border-radius:24px;">
            </td>
          </tr>

          <!-- Faixa verde + vermelha (cores da marca CAMIM) -->
          <tr>
            <td style="padding:0 28px 8px;">
              <div style="height:4px;background:linear-gradient(90deg,#16a34a 0%,#16a34a 50%,#dc2626 50%,#dc2626 100%);border-radius:999px;"></div>
            </td>
          </tr>

          <!-- Subject -->
          <tr>
            <td style="padding:18px 28px 6px;text-align:center;">
              <h1 style="margin:0;font-size:20px;font-weight:700;color:#166534;line-height:1.3;">
                {{ subject }}
              </h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:6px 28px 22px;">
              <div style="font-size:15px;line-height:1.6;color:#374151;white-space:pre-wrap;">{{ body_text }}</div>
            </td>
          </tr>

          {% if cta_url %}
          <!-- CTA -->
          <tr>
            <td align="center" style="padding:0 28px 30px;">
              <a href="{{ cta_url }}"
                 style="display:inline-block;padding:13px 30px;background:#16a34a;color:#ffffff !important;text-decoration:none;border-radius:10px;font-weight:600;font-size:14px;letter-spacing:.2px;box-shadow:0 2px 8px rgba(34,197,94,.35);">
                {{ cta_label|default:"Abrir no NossoTrello" }}
              </a>
            </td>
          </tr>
          {% endif %}

          <!-- Rodapé -->
          <tr>
            <td style="padding:18px 28px 24px;background:#f8fafc;text-align:center;border-top:1px solid #e5e7eb;">
              <p style="margin:0 0 6px;font-size:12px;color:#6b7280;line-height:1.5;">
                Você está recebendo este e-mail porque ativou notificações sociais no NossoTrello.
              </p>
              <p style="margin:0;font-size:11px;color:#9ca3af;line-height:1.5;">
                Para alterar, acesse <strong style="color:#374151;">Minha conta → Notificações</strong>.
              </p>
            </td>
          </tr>

        </table>

        <!-- assinatura discreta -->
        <p style="margin:14px 0 0;font-size:11px;color:#9ca3af;letter-spacing:.4px;">
          NossoTrello Social · Clínica CAMIM
        </p>

      </td>
    </tr>
  </table>
</body>
</html>
