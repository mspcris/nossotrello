services:
  web:
    build: .
    restart: always
    command: sh -lc "mkdir -p /app/staticfiles && python manage.py collectstatic --noinput && gunicorn nossotrello.wsgi:application -b 0.0.0.0:8000 --workers 4 --worker-class gthread --threads 8 --worker-tmp-dir /dev/shm --timeout 120 --graceful-timeout 30"
    depends_on:
      - db
      - redis
      - redis-queue
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: nossotrello.settings
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      DB_ENGINE: postgresql
      DB_NAME: nossotrello
      DB_USER: nossotrello
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nossotrello_secret}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - ${SQLITE_DIR:-./data/sqlite}:/app/db
      - ./static:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    expose:
      - "8000"

  # ============================================================
  # DAPHNE — servidor ASGI só para WebSocket (/ws/)
  # ------------------------------------------------------------
  # Roda em paralelo ao gunicorn. Nginx roteia /ws/ -> daphne,
  # resto -> gunicorn. Isso evita migrar o HTTP inteiro para ASGI
  # agora e mantém o deploy reversível.
  # ============================================================
  daphne:
    build: .
    restart: always
    command: sh -lc "python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8001 nossotrello.asgi:application"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: nossotrello.settings
      REDIS_URL: redis://redis:6379/1
      DB_ENGINE: postgresql
      DB_NAME: nossotrello
      DB_USER: nossotrello
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nossotrello_secret}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - ${SQLITE_DIR:-./data/sqlite}:/app/db
      - ./static:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    expose:
      - "8001"

  # ============================================================
  # BRIDGE — consumer RabbitMQ -> Channels (Redis)
  # ------------------------------------------------------------
  # Processo separado rodando `manage.py rabbit_bridge`. Lê eventos
  # do exchange nossotrello e faz group_send no channel layer,
  # o que entrega o payload ao browser via Daphne/WebSocket.
  # ============================================================
  bridge:
    build: .
    restart: always
    command: sh -lc "python manage.py rabbit_bridge"
    depends_on:
      - db
      - redis
      - daphne
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: nossotrello.settings
      REDIS_URL: redis://redis:6379/1
      DB_ENGINE: postgresql
      DB_NAME: nossotrello
      DB_USER: nossotrello
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nossotrello_secret}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - ./logs:/app/logs

  # ============================================================
  # SCHEDULER — roda os jobs recorrentes a cada 10 minutos
  # ------------------------------------------------------------
  # Loop simples (não precisa de cron na VM): a cada 600s dispara
  #   - sync_email_cards      (e-mail -> card; respeita o intervalo de cada caixa)
  #   - run_column_autosort   (auto-ordenação; respeita a frequência de cada coluna)
  #   - run_stale_automations (automação "card parado X dias")
  #   - run_monthly_reports   (relatório mensal: cobrança do dia 15 + retry da IA)
  # Cada comando é tolerante a falha (|| true) pra não derrubar o loop.
  # notify_cards_due NÃO entra aqui (é diário às 08:00, com --kind próprio).
  # ============================================================
  # celery beat: dispara as tarefas periódicas (CELERY_BEAT_SCHEDULE no settings).
  # Só agenda; quem executa é o worker. Mantém o nome "scheduler" de propósito.
  scheduler:
    build: .
    restart: always
    # entrypoint próprio: o padrão da imagem roda collectstatic + migrate, que é
    # papel do web/deploy — worker não deve disputar migração a cada boot.
    entrypoint: ["sh", "-lc"]
    command: ["celery -A nossotrello beat --loglevel=INFO -s /tmp/celerybeat-schedule"]
    depends_on:
      - redis
      - redis-queue
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: nossotrello.settings
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      DB_ENGINE: postgresql
      DB_NAME: nossotrello
      DB_USER: nossotrello
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nossotrello_secret}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - ${SQLITE_DIR:-./data/sqlite}:/app/db
      - ./media:/app/media
      - ./logs:/app/logs

  # ============================================================
  # WORKERS DA FILA (Celery) — ver nossotrello/celery.py
  # ------------------------------------------------------------
  #   worker          e-mail, WhatsApp, notificações, comandos periódicos
  #   worker-media    ffmpeg / IA (pesado, isolado pra não segurar o resto)
  #   worker-ordered  UM consumidor: operações do quadro na ordem do clique
  # ============================================================
  worker:
    build: .
    restart: always
    # entrypoint próprio: o padrão da imagem roda collectstatic + migrate, que é
    # papel do web/deploy — worker não deve disputar migração a cada boot.
    entrypoint: ["sh", "-lc"]
    command: ["celery -A nossotrello worker -Q default -c 4 --loglevel=INFO -n default@%h"]
    depends_on:
      - redis
      - redis-queue
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: nossotrello.settings
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      DB_ENGINE: postgresql
      DB_NAME: nossotrello
      DB_USER: nossotrello
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nossotrello_secret}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - ${SQLITE_DIR:-./data/sqlite}:/app/db
      - ./media:/app/media
      - ./logs:/app/logs

  worker-media:
    build: .
    restart: always
    # entrypoint próprio: o padrão da imagem roda collectstatic + migrate, que é
    # papel do web/deploy — worker não deve disputar migração a cada boot.
    entrypoint: ["sh", "-lc"]
    command: ["celery -A nossotrello worker -Q media -c 2 --loglevel=INFO -n media@%h"]
    depends_on:
      - redis
      - redis-queue
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: nossotrello.settings
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      DB_ENGINE: postgresql
      DB_NAME: nossotrello
      DB_USER: nossotrello
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nossotrello_secret}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - ${SQLITE_DIR:-./data/sqlite}:/app/db
      - ./media:/app/media
      - ./logs:/app/logs

  worker-ordered:
    build: .
    restart: always
    # entrypoint próprio: o padrão da imagem roda collectstatic + migrate, que é
    # papel do web/deploy — worker não deve disputar migração a cada boot.
    entrypoint: ["sh", "-lc"]
    command: ["celery -A nossotrello worker -Q board_ops -c 1 --loglevel=INFO -n ordered@%h"]
    depends_on:
      - redis
      - redis-queue
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: nossotrello.settings
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      DB_ENGINE: postgresql
      DB_NAME: nossotrello
      DB_USER: nossotrello
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nossotrello_secret}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - ${SQLITE_DIR:-./data/sqlite}:/app/db
      - ./media:/app/media
      - ./logs:/app/logs

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: nossotrello
      POSTGRES_USER: nossotrello
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nossotrello_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  # Broker da fila de tarefas. Separado do redis do cache de propósito: aquele
  # descarta chave quando enche (allkeys-lru); este grava em disco e nunca descarta.
  redis-queue:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    expose:
      - "6379"
    volumes:
      - redis_queue_data:/data

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-8081}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nossotrello.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/502.html:/etc/nginx/502.html
      - nginx_media_cache:/var/cache/nginx/media
      - ./static:/static
      - ./media:/media
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - web
      - daphne

volumes:
  pg_data:
  redis_data:
  redis_queue_data:
  nginx_media_cache:
