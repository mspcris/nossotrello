<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tarefas CAMIM - Atualizando...</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg) } }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 1rem; opacity: 0.85; line-height: 1.5; margin-bottom: 8px; }
    .hint { font-size: 0.85rem; opacity: 0.6; margin-top: 20px; }
    .retry-btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 32px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s;
    }
    .retry-btn:hover { background: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Estamos atualizando!</h1>
    <p>O Tarefas CAMIM est&aacute; recebendo melhorias.<br>Isso leva menos de 1 minuto.</p>
    <a class="retry-btn" onclick="location.reload()">Tentar novamente</a>
    <div class="hint">A p&aacute;gina recarrega automaticamente...</div>
  </div>
  <script>setTimeout(function(){ location.reload(); }, 10000);</script>
</body>
</html>
