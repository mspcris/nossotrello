<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="35" ry="45" fill="#E8EAED"/>
  <ellipse cx="100" cy="140" rx="30" ry="40" fill="#F1F3F4"/>
  <!-- Head -->
  <ellipse cx="100" cy="75" rx="38" ry="35" fill="#E8EAED"/>
  <ellipse cx="100" cy="75" rx="34" ry="31" fill="#2D3748"/>
  <!-- Eyes -->
  <path d="M80,72 Q87,65 94,72" stroke="#67E8F9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M106,72 Q113,65 120,72" stroke="#67E8F9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nurse hat -->
  <rect x="75" y="42" width="50" height="18" rx="4" fill="#F1F3F4"/>
  <rect x="95" y="35" width="10" height="25" rx="2" fill="#F1F3F4"/>
  <text x="100" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">+</text>
  <!-- Stethoscope -->
  <path d="M70,100 Q55,120 65,140" stroke="#4B5563" stroke-width="2.5" fill="none"/>
  <circle cx="65" cy="142" r="4" fill="#4B5563"/>
  <!-- Heart -->
  <g transform="translate(140,85) scale(0.6)">
    <path d="M0,-15 C-15,-30 -35,-10 -20,10 L0,25 L20,10 C35,-10 15,-30 0,-15Z" fill="#374151"/>
    <path d="M-15,0 L-8,-8 L-3,2 L3,-5 L8,0 L15,-3" stroke="#E8EAED" stroke-width="2" fill="none"/>
  </g>
  <!-- Arms -->
  <path d="M65,120 Q50,130 55,145" stroke="#E8EAED" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M135,120 Q145,135 140,150" stroke="#E8EAED" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="188" rx="25" ry="5" fill="rgba(0,0,0,0.15)"/>
</svg>