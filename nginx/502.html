<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tarefas CAMIM - Atualizando...</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      padding: 20px;
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .logo { font-size: 2rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
    .logo span { color: #4facfe; }
    .subtitle { font-size: .85rem; opacity: 0.5; margin-bottom: 24px; }

    .progress-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      height: 6px;
      margin: 0 20px 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, #4facfe, #00f2fe, #4facfe);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease infinite;
      width: 0%;
      transition: width 0.5s linear, background 0.6s;
    }
    .progress-bar.overtime {
      background: linear-gradient(90deg, #ffb347, #ffcc33, #ffb347);
      background-size: 200% 100%;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .warn {
      color: #ffcc33;
      font-size: .78rem;
      margin-top: 6px;
      min-height: 1.1em;
      opacity: 0;
      transition: opacity .4s;
    }
    .warn.visible { opacity: 1; }

    .phrase {
      font-size: 1.05rem;
      min-height: 3.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      transition: opacity .4s;
      line-height: 1.5;
    }

    .retry-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      border-radius: 12px;
      color: #1a1a2e;
      font-size: .95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .retry-btn:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(79,172,254,0.4); }
    .retry-btn:active { transform: scale(0.97); }

    .timer { font-size: .78rem; opacity: 0.4; margin-top: 14px; }

    .particles {
      position: fixed; inset: 0; pointer-events: none; z-index: -1;
    }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: rgba(79,172,254,0.3);
      border-radius: 50%;
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="logo">Tarefas <span>CAMIM</span></div>
    <div class="subtitle">Sistema de Quadros &amp; Rede Social</div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <div class="phrase" id="phrase">Atualizando o servidor...</div>

    <button class="retry-btn" onclick="location.reload()">Tentar novamente</button>
    <div class="timer" id="timer">Calculando tempo estimado...</div>
    <div class="warn" id="warn"></div>
  </div>

<script>
var phrases = [
  "Atualizando o servidor...",
  "Preparando as novidades...",
  "Quase l&aacute;, s&oacute; mais um instante...",
  "Instalando melhorias no sistema...",
  "Carregando os quadros...",
  "Organizando as colunas...",
  "Alimentando o banco de dados...",
  "Ajustando os parafusos digitais...",
  "Leonardo fechando a folha...",
  "J&uacute;lio: N&atilde;o autorizo!",
  "Camila.AI acordando do cochilo...",
  "Contando os cards pendentes...",
  "Sincronizando as notifica&ccedil;&otilde;es...",
  "Polindo os bot&otilde;es...",
  "Verificando os prazos vencidos...",
  "Atualizando o feed social...",
  "R&ocirc;mulo testando o sistema...",
  "Migrando os dados com carinho...",
  "Reiniciando os servi&ccedil;os...",
  "Otimizando a velocidade...",
  "Compilando o c&oacute;digo novo...",
  "Aplicando as corre&ccedil;&otilde;es...",
  "Recarregando os estilos...",
  "Limpando o cache antigo...",
  "Preparando o caf&eacute; do servidor...",
  "Afiando as engrenagens...",
  "Conferindo os checklists...",
  "Subindo os containers Docker...",
  "Testando as conex&otilde;es...",
  "Atualizando as depend&ecirc;ncias...",
  "Validando as migra&ccedil;&otilde;es...",
  "Reorganizando as tarefas...",
  "Recalibrando o sistema...",
  "Dando um tapa no visual...",
  "O servidor pediu 5 minutinhos...",
  "Aguarde... magia acontecendo...",
  "Deploy em andamento, respira fundo...",
  "Certificando que tudo est&aacute; perfeito...",
  "Quase pronto, prometo!",
  "Finalizando a atualiza&ccedil;&atilde;o..."
];

var idx = 0;
var el = document.getElementById('phrase');

function nextPhrase() {
  el.style.opacity = '0';
  setTimeout(function() {
    idx = (idx + 1) % phrases.length;
    el.innerHTML = phrases[idx];
    el.style.opacity = '1';
  }, 400);
}

setInterval(nextPhrase, 3000);

// Shuffle on load
for (var i = phrases.length - 1; i > 0; i--) {
  var j = Math.floor(Math.random() * (i + 1));
  var t = phrases[i]; phrases[i] = phrases[j]; phrases[j] = t;
}
el.innerHTML = phrases[0];

// ========================================================================
// Countdown baseado no tempo REAL do outage (persistido em sessionStorage)
// ------------------------------------------------------------------------
// - Deploy típico: ~4 minutos. Estimativa de retorno: 5 minutos.
// - A barra de progresso e o countdown refletem o elapsed desde o 1º 502.
// - Antes de 3m30s: só countdown, sem tentar reload (deixa o servidor trabalhar).
// - A partir de 3m30s: reload automático a cada 15s.
// - Passando de 5min: alerta "demorando mais que o normal" + barra fica amarela.
// - Se o usuário ficou > 10min sem 502, reseta o relógio (novo outage).
// ========================================================================
var ESTIMATED_TOTAL_MS = 5 * 60 * 1000;   // 5min
var RETRY_START_MS     = 3.5 * 60 * 1000; // 3m30s
var RETRY_INTERVAL_MS  = 15 * 1000;       // 15s
var SESSION_WINDOW_MS  = 10 * 60 * 1000;  // reset se gap > 10min

var nowMs = Date.now();
var outageStart = 0;
try { outageStart = parseInt(sessionStorage.getItem('tarefas_502_start') || '0', 10); } catch (e) {}
if (!outageStart || (nowMs - outageStart) > SESSION_WINDOW_MS) {
  outageStart = nowMs;
  try { sessionStorage.setItem('tarefas_502_start', String(outageStart)); } catch (e) {}
}

var timerEl   = document.getElementById('timer');
var warnEl    = document.getElementById('warn');
var barEl     = document.querySelector('.progress-bar');

function fmtSecs(s) {
  if (s >= 60) {
    var m = Math.floor(s / 60);
    var r = s % 60;
    return r > 0 ? (m + 'min ' + r + 's') : (m + 'min');
  }
  return s + 's';
}

function tick() {
  var elapsed = Date.now() - outageStart;
  var remaining = ESTIMATED_TOTAL_MS - elapsed;

  // Barra — vai de 0% a 100% ao longo dos 5min, satura em 100% depois disso
  var pct = Math.min(100, (elapsed / ESTIMATED_TOTAL_MS) * 100);
  barEl.style.width = pct.toFixed(1) + '%';

  if (elapsed > ESTIMATED_TOTAL_MS) {
    // Passou do tempo estimado — estado "demorando mais que o normal"
    barEl.classList.add('overtime');
    var extraSecs = Math.floor((elapsed - ESTIMATED_TOTAL_MS) / 1000);
    timerEl.textContent = 'Tempo estimado excedido (+' + fmtSecs(extraSecs) + ')';
    warnEl.textContent = 'Está demorando mais que o normal. Continuando a tentar...';
    warnEl.classList.add('visible');
  } else {
    barEl.classList.remove('overtime');
    var remSecs = Math.ceil(remaining / 1000);
    timerEl.textContent = 'Tempo estimado para retornar: ' + fmtSecs(remSecs);
    warnEl.classList.remove('visible');
  }
}

tick();
setInterval(tick, 1000);

// Agendamento do 1º reload automático
var elapsedOnLoad = Date.now() - outageStart;
var firstReloadIn;
if (elapsedOnLoad < RETRY_START_MS) {
  // Ainda não chegou aos 3m30s — espera faltando
  firstReloadIn = RETRY_START_MS - elapsedOnLoad;
} else {
  // Já passou do limiar — próximo reload em 15s
  firstReloadIn = RETRY_INTERVAL_MS;
}
setTimeout(function() { location.reload(); }, firstReloadIn);

// Particles
var pc = document.getElementById('particles');
for (var p = 0; p < 20; p++) {
  var d = document.createElement('div');
  d.className = 'particle';
  d.style.left = Math.random() * 100 + '%';
  d.style.animationDuration = (6 + Math.random() * 8) + 's';
  d.style.animationDelay = Math.random() * 8 + 's';
  d.style.width = d.style.height = (2 + Math.random() * 4) + 'px';
  pc.appendChild(d);
}
</script>
</body>
</html>
