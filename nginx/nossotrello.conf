# Cache zone para arquivos servidos do banco (StoredFile)
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=7d;

# Upgrade header para WebSocket (conforme recomendação oficial do nginx).
# Mapeia Connection:upgrade só quando há Upgrade:websocket; caso contrário vazio.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # ── Gzip compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # STATIC FILES — long-lived cache (immutable assets have hashed names)
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # MEDIA FILES — filesystem (fallback para arquivos ainda não migrados)
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # MEDIA SERVE — arquivos do banco (proxy cache na frente do Django)
    location /media/serve/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache media_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Página de manutenção (502/503/504)
    error_page 502 503 504 /502.html;
    location = /502.html {
        root /etc/nginx;
        internal;
    }

    # WEBSOCKET -> DAPHNE
    # Daphne serve só o tráfego /ws/ em um processo separado (porta 8001).
    # Gunicorn continua servindo todo o HTTP normal.
    location /ws/ {
        proxy_pass http://daphne:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket precisa de timeout muito alto — senão o cliente
        # é desconectado a cada 60s de silêncio.
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 60s;

        proxy_buffering off;
    }

    # PROXY PARA DJANGO (GUNICORN)
    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Timeouts ────────────────────────────────────────────────
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ── Buffer tuning ───────────────────────────────────────────
        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         16 8k;
    }
}
