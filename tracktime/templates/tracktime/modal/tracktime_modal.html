{# tracktime/templates/tracktime/modal/tracktime_modal.html #}
{% load static %}

<div id="cm-root" class="cm-modal-root"{% if page_mode %} data-tt-page-mode="1"{% endif %}>
  <!-- HEADER -->
  <div class="cm-modal-header">
    <div class="cm-modal-title">Track-time</div>
  </div>

  <!-- TABS -->
  <div class="cm-modal-tabs" style="display:flex; gap:8px; padding: 10px 12px; flex-wrap: wrap;">
    <button
      type="button"
      class="tt-tab tt-btn tt-btn-primary"
      data-tt-tab="live"
      hx-get="{% url 'tracktime:tab_live' %}"
      hx-target="#tt-tab-body"
      hx-swap="innerHTML"
    >
      Ao vivo
    </button>

    <button
      type="button"
      class="tt-tab tt-btn"
      data-tt-tab="day"
      hx-get="{% url 'tracktime:tab_day' %}"
      hx-target="#tt-tab-body"
      hx-swap="innerHTML"
    >
      Hoje
    </button>

    <button
      type="button"
      class="tt-tab tt-btn"
      data-tt-tab="week"
      hx-get="{% url 'tracktime:tab_week' %}"
      hx-target="#tt-tab-body"
      hx-swap="innerHTML"
    >
    
      Semana
    </button>

    <button
      type="button"
      class="tt-tab tt-btn"
      data-tt-tab="month"
      hx-get="{% url 'tracktime:tab_month' %}"
      hx-target="#tt-tab-body"
      hx-swap="innerHTML"
    >
      Mês
    </button>

    <button
      type="button"
      class="tt-tab tt-btn"
      data-tt-tab="portal"
      hx-get="{% url 'tracktime:tab_portal' %}"
      hx-target="#tt-tab-body"
      hx-swap="innerHTML"
    >
      Cadastros
    </button>

    <button
  type="button"
  class="tt-tab tt-btn"
  data-tt-tab="online"
  hx-get="{% url 'tracktime:tab_online' %}"
  hx-target="#tt-tab-body"
  hx-swap="innerHTML"
>
  On-Line - Sem track-time
</button>

{% if user.is_superuser or user.is_staff or user.email == "cristiano@camim.com.br" %}
    <button
  type="button"
  class="tt-tab tt-btn"
  data-tt-tab="limits"
  hx-get="{% url 'tracktime:tab_limits' %}"
  hx-target="#tt-tab-body"
  hx-swap="innerHTML"
>
  ⏱ Limites
</button>
{% endif %}


    
  </div>

  <!-- BODY -->
  <div id="tt-tab-body" class="cm-modal-body" style="padding: 12px;">
    {# tab inicial vem de ?tab= (default: Ao vivo) #}
    <div
      hx-get="{% if initial_tab_url %}{{ initial_tab_url }}{% else %}{% url 'tracktime:tab_live' %}{% endif %}"
      hx-trigger="load"
      hx-target="#tt-tab-body"
      hx-swap="innerHTML"
    ></div>
  </div>
</div>

<script>
(function () {
  const root = document.getElementById("cm-root");
  if (!root) return;

  const pageMode = root.dataset.ttPageMode === "1";

  function setActive(tabName) {
    root.querySelectorAll(".tt-tab").forEach((btn) => {
      const isActive = (btn.dataset.ttTab === tabName);
      btn.classList.toggle("tt-btn-primary", isActive);
      btn.classList.toggle("tt-btn", true);
    });
    try { root.dataset.ttActiveTab = tabName; } catch(e) {}
    // na página com URL própria, grava a tab na URL → F5 volta na mesma tab
    if (pageMode) {
      try { history.replaceState(null, "", "?tab=" + encodeURIComponent(tabName)); } catch(e) {}
    }
  }

  // click -> já marca visualmente antes do HTMX terminar
  root.addEventListener("click", (e) => {
    const btn = e.target.closest(".tt-tab");
    if (!btn) return;
    setActive(btn.dataset.ttTab || "live");
  });

  // quando o HTMX pedir algo vindo de um botão tab, garante seleção
  document.body.addEventListener("htmx:beforeRequest", (e) => {
    const elt = e.detail.elt;
    if (!elt) return;
    const btn = elt.closest?.(".tt-tab");
    if (!btn) return;
    setActive(btn.dataset.ttTab || "live");
  });

  // fallback: se o conteúdo carregar por "load", mantém live ativo
  document.body.addEventListener("htmx:afterSwap", (e) => {
    if (e.detail.target && e.detail.target.id === "tt-tab-body") {
      const current = root.dataset.ttActiveTab || "live";
      setActive(current);
    }
  });

  // init
  setActive("{{ tab|default:'live' }}");
})();
</script>
