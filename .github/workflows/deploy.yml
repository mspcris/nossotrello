name: Deploy Produção (VM)

# Dispara quando a branch `deploy` recebe push, ou manualmente pela UI.
on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = prune + rebuild tudo | fast = só rebuild + migrate"
        required: false
        default: "fast"
        type: choice
        options:
          - fast
          - full

# Só um deploy por vez.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + rebuild stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 25m
          script_stop: true
          envs: DEPLOY_MODE
          script: |
            set -euo pipefail
            cd /opt/nossotrello

            livre_gb() { df -BG --output=avail / | tail -1 | tr -dc '0-9'; }

            echo "==> disco antes: $(livre_gb) GB livres"

            # ── Guarda de espaco ──
            # Build sem disco morre no meio e deixa o stack fora do ar. Se
            # estiver apertado, limpa o cache ANTES de comecar, nao depois.
            if [ "$(livre_gb)" -lt 25 ]; then
              echo "==> pouco espaco livre: limpando cache de build antes do build"
              docker builder prune -af || true
              docker image prune -af || true
              echo "==> disco apos limpeza preventiva: $(livre_gb) GB livres"
            fi

            # ── Git sync (sempre) ──
            echo "==> git sync"
            git fetch origin
            git reset --hard origin/deploy

            # ── Full: prune + down (só no modo full) ──
            if [ "${DEPLOY_MODE}" = "full" ]; then
              # NUNCA --volumes aqui. Esta VM hospeda outros projetos (hesk,
              # camila2_meuchatbot, nossotrello_hml...) e volume de stack
              # parado conta como "nao usado": --volumes apagaria o banco
              # deles junto. Sem a flag, o prune ainda libera imagem,
              # container e cache, que e onde o espaco realmente esta.
              echo "==> docker system prune (sem volumes)"
              docker system prune -af
              echo "==> compose down"
              docker compose -p nossotrello down --remove-orphans
            fi

            # ── Build + recreate ──
            echo "==> compose up --build"
            docker compose -p nossotrello up -d --build --force-recreate

            # ── Migrate + collectstatic (sempre) ──
            echo "==> migrate"
            docker exec nossotrello-web-1 python manage.py migrate

            echo "==> repair legacy file refs"
            docker exec nossotrello-web-1 python manage.py repair_legacy_file_refs --apply

            echo "==> collectstatic"
            docker exec nossotrello-web-1 sh -lc "python manage.py collectstatic --noinput --clear"

            echo "==> novidades (import + curadoria)"
            docker exec nossotrello-web-1 python manage.py sync_whats_new --limit 300 || true
            docker exec nossotrello-web-1 python manage.py curate_whats_new || true

            # ── Limpeza leve (sempre): evita encher o disco com deploys seguidos ──
            # Cada rebuild deixa a imagem antiga sem tag (orfa). Removemos TODAS as
            # orfas nao usadas -> sobra so a imagem atual (em uso pelo container).
            # `docker image prune` nunca apaga imagem com tag/em uso, entao e seguro.
            # NAO mexe em volumes.
            echo "==> prune: imagens orfas (deixa so a em uso)"
            docker image prune -f || true

            # Cache de build limitado por TAMANHO, nao por idade.
            # O filtro antigo (until=168h) so pegava cache com mais de 7 dias:
            # com deploy quase diario, o cache da semana nunca era alcancado e
            # chegou a 45 GB de lixo. Agora sobram no maximo 10 GB, sempre.
            # --reserved-space e a flag do Docker >= 28 (substituiu --keep-storage).
            echo "==> prune: cache de build acima de 10 GB"
            docker builder prune -af --reserved-space 10GB || true

            echo "==> disco depois: $(livre_gb) GB livres"
            echo "==> done"
        env:
          DEPLOY_MODE: ${{ inputs.mode || 'fast' }}

      # O passo acima terminava "verde" mesmo com o site fora do ar: ele so
      # verifica se os comandos rodaram, nao se a aplicacao respondeu. Aqui o
      # deploy so e considerado bom se o site voltar de fato.
      - name: Smoke test (site respondendo)
        run: |
          alvo="https://tarefas.camim.com.br/"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$alvo" || echo 000)
            echo "tentativa $i/20: HTTP $code"
            case "$code" in
              2*|3*) echo "✅ site no ar (HTTP $code)"; exit 0 ;;
            esac
            sleep 10
          done
          echo "❌ $alvo nao respondeu 2xx/3xx em ~3min — deploy suspeito"
          exit 1
