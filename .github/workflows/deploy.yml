name: Deploy Produção (VM)

# Dispara quando a branch `deploy` recebe push, ou manualmente pela UI.
on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = prune + rebuild tudo | fast = só rebuild + migrate"
        required: false
        default: "fast"
        type: choice
        options:
          - fast
          - full

# Só um deploy por vez.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + rebuild stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 25m
          script_stop: true
          envs: DEPLOY_MODE
          script: |
            set -euo pipefail
            cd /opt/nossotrello

            # ── Git sync (sempre) ──
            echo "==> git sync"
            git fetch origin
            git reset --hard origin/deploy

            # ── Full: prune + down (só no modo full) ──
            if [ "${DEPLOY_MODE}" = "full" ]; then
              echo "==> docker system prune"
              docker system prune -af --volumes
              echo "==> compose down"
              docker compose -p nossotrello down --remove-orphans
            fi

            # ── Build + recreate ──
            echo "==> compose up --build"
            docker compose -p nossotrello up -d --build --force-recreate

            # ── Migrate + collectstatic (sempre) ──
            echo "==> migrate"
            docker exec nossotrello-web-1 python manage.py migrate

            echo "==> repair legacy file refs"
            docker exec nossotrello-web-1 python manage.py repair_legacy_file_refs --apply

            echo "==> collectstatic"
            docker exec nossotrello-web-1 sh -lc "python manage.py collectstatic --noinput --clear"

            echo "==> novidades (import + curadoria)"
            docker exec nossotrello-web-1 python manage.py sync_whats_new --limit 300 || true
            docker exec nossotrello-web-1 python manage.py curate_whats_new || true

            echo "==> done"
        env:
          DEPLOY_MODE: ${{ inputs.mode || 'fast' }}
