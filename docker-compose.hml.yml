services:
  web:
    build: .
    restart: always
    # entrypoint.sh cuida de: fix_migrations → migrate → collectstatic
    # command padrão vem do Dockerfile (gunicorn)
    volumes:
      - .:/app
      - ./data/nossotrello_hml:/app/db
      - ./static:/app/staticfiles
      - ./media:/app/media
    env_file:
      - .env.hml
    environment:
      DJANGO_SETTINGS_MODULE: nossotrello.settings
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nossotrello-hml.conf:/etc/nginx/conf.d/default.conf
      - ./static:/static
      - ./media:/media
    depends_on:
      - web
